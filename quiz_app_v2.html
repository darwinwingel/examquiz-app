<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="研修テスト">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<title>研修テスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Hiragino Sans,sans-serif}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;
     padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ===== SCREENS ===== */
.screen{display:none;width:100%;max-width:700px;padding:20px 16px;flex:1;flex-direction:column;overflow-y:auto}
.screen.active{display:flex}

/* ===== START ===== */
#startScreen{gap:22px}
h1{font-size:1.55rem;font-weight:700;color:#7c9cf5;text-align:center}
.subtitle{text-align:center;color:#64748b;font-size:.85rem}
.section-label{font-size:.75rem;color:#64748b;letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px}
.cat-btn{padding:7px 14px;border-radius:20px;border:1.5px solid #334155;background:transparent;
         color:#94a3b8;cursor:pointer;font-size:.8rem;transition:all .15s;line-height:1.4;text-align:left}
.cat-btn:hover,.cat-btn.sel{background:#1e3a5f;border-color:#7c9cf5;color:#e2e8f0}
.count-row{display:flex;gap:10px;flex-wrap:wrap}
.cnt-btn{flex:1;min-width:55px;padding:10px 6px;border-radius:10px;border:1.5px solid #334155;
         background:transparent;color:#94a3b8;cursor:pointer;font-size:.88rem;text-align:center;transition:all .15s}
.cnt-btn:hover,.cnt-btn.sel{background:#1e3a5f;border-color:#7c9cf5;color:#e2e8f0}
#startBtn{padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#3b82f6,#6366f1);
          color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s}
#startBtn:hover{opacity:.85}

/* ===== QUIZ ===== */
#quizScreen{gap:14px}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#64748b}
.cat-label-text{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-bar{height:4px;background:#1e293b;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1);transition:width .35s}
.question-box{background:#1a2235;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.q-instruction{font-size:.82rem;color:#7c9cf5;line-height:1.55}
.q-statement{font-size:.97rem;line-height:1.8;color:#e2e8f0;white-space:pre-wrap}
.choice-row{display:flex;gap:10px}
.choice-btn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid #334155;background:#0f1117;
            color:#e2e8f0;font-size:1rem;cursor:pointer;transition:all .18s;font-weight:600;
            line-height:1.4;word-break:break-all;text-align:center}
.choice-btn:hover:not(:disabled){transform:translateY(-2px);background:#1e3a5f;border-color:#7c9cf5}
.choice-btn.maru-x{font-size:1.6rem}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{background:#14532d;border-color:#22c55e;color:#86efac}
.choice-btn.wrong{background:#450a0a;border-color:#ef4444;color:#fca5a5}
.feedback-box{background:#1a2235;border-radius:14px;padding:16px;display:none;flex-direction:column;gap:10px}
.feedback-box.visible{display:flex}
.verdict{font-size:1.15rem;font-weight:700}
.verdict.ok{color:#22c55e}
.verdict.ng{color:#ef4444}
.correct-ans{font-size:.82rem;color:#94a3b8}
.explain-text{font-size:.85rem;line-height:1.7;color:#cbd5e1;
              border-top:1px solid #334155;padding-top:10px;white-space:pre-wrap}
#nextBtn{padding:14px;border-radius:12px;border:none;background:#1e293b;color:#e2e8f0;
         font-size:.93rem;font-weight:600;cursor:pointer;display:none;transition:background .15s}
#nextBtn:hover{background:#334155}
#nextBtn.visible{display:block}
.kbd-hint{text-align:center;font-size:.72rem;color:#334155;margin-top:auto;padding-top:6px}

/* ===== RESULT ===== */
#resultScreen{gap:20px;align-items:center}
.score-circle{width:150px;height:150px;border-radius:50%;border:8px solid #22c55e;
              display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px auto}
.score-pct{font-size:2.2rem;font-weight:800}
.score-sub{font-size:.82rem;color:#64748b;margin-top:2px}
.cat-result{width:100%;background:#1a2235;border-radius:14px;padding:16px}
.cat-result h3{font-size:.82rem;color:#64748b;margin-bottom:12px;letter-spacing:.06em;text-transform:uppercase}
.cat-row{display:flex;justify-content:space-between;align-items:center;
         padding:8px 0;border-bottom:1px solid #1e293b;font-size:.82rem;gap:8px}
.cat-row:last-child{border-bottom:none}
.cat-name{color:#94a3b8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-score{color:#e2e8f0;white-space:nowrap;flex-shrink:0}
.cat-mini-bar{height:4px;border-radius:2px;background:#1e293b;width:60px;flex-shrink:0}
.cat-mini-fill{height:100%;border-radius:2px;background:#3b82f6;transition:width .4s}
.result-btns{display:flex;gap:12px;width:100%}
.result-btns button{flex:1;padding:14px;border-radius:12px;border:none;
                    font-size:.93rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.result-btns button:hover{opacity:.85}
#retryBtn{background:#1e293b;color:#e2e8f0}
#backBtn{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
/* ===== REVIEW SCREEN ===== */
#reviewScreen{gap:14px}
#reviewScreen h1{font-size:1.2rem}
.review-header{display:flex;justify-content:space-between;align-items:center;width:100%}
.review-count{font-size:.82rem;color:#64748b}
.review-card{background:#1a2235;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%}
.review-q-num{font-size:.72rem;color:#64748b}
.review-instruction{font-size:.78rem;color:#7c9cf5;line-height:1.5}
.review-statement{font-size:.9rem;line-height:1.75;color:#e2e8f0;white-space:pre-wrap}
.review-en{font-size:.75rem;color:#64748b;line-height:1.6;font-style:italic;border-top:1px solid #1e293b;padding-top:8px;display:none}
.review-en.visible{display:block}
.review-choices{display:flex;gap:10px}
.review-choice{flex:1;padding:10px 6px;border-radius:10px;border:2px solid;font-size:.9rem;font-weight:600;text-align:center;cursor:default}
.review-choice.correct{background:#14532d;border-color:#22c55e;color:#86efac}
.review-choice.wrong-sel{background:#450a0a;border-color:#ef4444;color:#fca5a5}
.review-choice.neutral{background:#1e293b;border-color:#334155;color:#94a3b8}
.review-answer-row{font-size:.82rem;color:#22c55e}
.review-explain{font-size:.82rem;line-height:1.7;color:#cbd5e1;border-top:1px solid #334155;padding-top:8px;white-space:pre-wrap}
.review-nav{display:flex;gap:10px;width:100%}
.review-nav button{flex:1;padding:12px;border-radius:12px;border:none;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.review-nav button:hover{opacity:.85}
#reviewPrevBtn{background:#1e293b;color:#e2e8f0}
#reviewNextBtn{background:#334155;color:#e2e8f0}
#reviewDoneBtn{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
.translate-btn{font-size:.72rem;color:#7c9cf5;background:none;border:none;cursor:pointer;padding:4px 0;text-align:left}
.translate-btn:hover{color:#a5b4fc}
#reviewBtn{background:#1e3a5f;border:1.5px solid #7c9cf5;color:#e2e8f0}
/* English translation in quiz screen */
.en-toggle-btn{font-size:.7rem;color:#64748b;background:none;border:none;cursor:pointer;padding:2px 0;text-align:left;text-decoration:underline}
.en-toggle-btn:hover{color:#94a3b8}
.q-english{font-size:.76rem;color:#64748b;line-height:1.55;font-style:italic;padding-top:4px;white-space:pre-wrap;display:none}
.q-english.visible{display:block}
</style>
</head>
<body>

<!-- ========== START ========== -->
<div class="screen active" id="startScreen">
  <h1>研修テスト</h1>
  <p class="subtitle">JVCEA 暗号資産取扱者向け</p>

  <div>
    <div class="section-label">カテゴリ</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <div>
    <div class="section-label">出題数</div>
    <div class="count-row" id="countRow">
      <button class="cnt-btn" data-n="10">10問</button>
      <button class="cnt-btn" data-n="20">20問</button>
      <button class="cnt-btn" data-n="50">50問</button>
      <button class="cnt-btn sel" data-n="0">全問</button>
    </div>
  </div>

  <button id="startBtn">スタート</button>
</div>

<!-- ========== QUIZ ========== -->
<div class="screen" id="quizScreen">
  <div class="progress-row">
    <span id="progText">1 / 10</span>
    <span class="cat-label-text" id="catLabel"></span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

  <div class="question-box">
    <div class="q-instruction" id="qInstruction"></div>
    <div class="q-statement" id="qStatement"></div>
    <button class="en-toggle-btn" id="enToggleBtn" onclick="toggleQuizEnglish()" style="display:none">🌐 英訳</button>
    <div class="q-english" id="qEnglish"></div>
  </div>

  <div class="choice-row" id="choiceRow">
    <button class="choice-btn" id="btn1" data-v="1"></button>
    <button class="choice-btn" id="btn2" data-v="2"></button>
  </div>

  <div class="feedback-box" id="feedbackBox">
    <div class="verdict" id="verdict"></div>
    <div class="correct-ans" id="correctAns"></div>
    <div class="explain-text" id="explainText"></div>
  </div>

  <button id="nextBtn">次の問題 →</button>
  <div class="kbd-hint" id="kbdHint">キー: 1=左 / 2=右 / Enter・Space=次へ</div>
</div>

<!-- ========== RESULT ========== -->
<div class="screen" id="resultScreen">
  <h1>結果</h1>
  <div class="score-circle" id="scoreCircle">
    <span class="score-pct" id="scorePct">0%</span>
    <span class="score-sub" id="scoreSub">0 / 0 正解</span>
  </div>
  <div class="cat-result">
    <h3>カテゴリ別</h3>
    <div id="catBreakdown"></div>
  </div>
  <div class="result-btns">
    <button id="retryBtn">もう一度</button>
    <button id="reviewBtn" style="display:none">間違い復習</button>
    <button id="backBtn">トップへ</button>
  </div>
</div>

<!-- ========== REVIEW ========== -->
<div class="screen" id="reviewScreen">
  <div class="review-header">
    <h1 id="reviewTitle">間違い復習</h1>
    <span class="review-count" id="reviewCount"></span>
  </div>
  <div class="review-card">
    <div class="review-q-num" id="reviewQNum"></div>
    <div class="review-instruction" id="reviewInstruction"></div>
    <div class="review-statement" id="reviewStatement"></div>
    <button class="translate-btn" id="translateBtn" onclick="toggleEnglish()">🌐 英訳を表示</button>
    <div class="review-en" id="reviewEn"></div>
    <div class="review-choices" id="reviewChoices"></div>
    <div class="review-answer-row" id="reviewAnswer"></div>
    <div class="review-explain" id="reviewExplain"></div>
  </div>
  <div class="review-nav">
    <button id="reviewPrevBtn" onclick="reviewNav(-1)">← 前</button>
    <button id="reviewNextBtn" onclick="reviewNav(1)">次 →</button>
    <button id="reviewDoneBtn" onclick="showScreen('resultScreen')">結果に戻る</button>
  </div>
</div>

let translationCache = {};  // cache translations by question no

async function fetchTranslation(q) {
  if (translationCache[q.no]) return translationCache[q.no];
  const nl = q.question.indexOf('\n\n');
  const stmt = nl !== -1 ? q.question.slice(nl + 2) : q.question;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 400,
        messages: [{role: 'user', content: 'Translate the following Japanese regulatory quiz question statement into concise English (1-3 sentences max). Output only the English translation, nothing else:\n\n' + stmt}]
      })
    });
    const data = await res.json();
    const text = data.content && data.content[0] && data.content[0].text ? data.content[0].text : '(Translation unavailable)';
    translationCache[q.no] = text;
    return text;
  } catch(e) {
    return '(Translation unavailable)';
  }
}

// ===== BUILD START SCREEN =====
(function initStart() {
  const categories = [...new Set(QUIZ_DATA.map(q => q.category))].sort();
  const grid = document.getElementById('catGrid');

  // 全カテゴリボタン
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn sel';
  allBtn.textContent = '全カテゴリ';
  allBtn.dataset.cat = '__all__';
  grid.appendChild(allBtn);

  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat;
    btn.dataset.cat = cat;
    grid.appendChild(btn);
  });

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.cat-btn');
    if (!btn) return;
    if (btn.dataset.cat === '__all__') {
      selectedCats.clear();
      grid.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
    } else {
      grid.querySelector('[data-cat="__all__"]').classList.remove('sel');
      if (selectedCats.has(btn.dataset.cat)) {
        selectedCats.delete(btn.dataset.cat);
        btn.classList.remove('sel');
      } else {
        selectedCats.add(btn.dataset.cat);
        btn.classList.add('sel');
      }
      if (selectedCats.size === 0) grid.querySelector('[data-cat="__all__"]').classList.add('sel');
    }
  });

  document.getElementById('countRow').addEventListener('click', e => {
    const btn = e.target.closest('.cnt-btn');
    if (!btn) return;
    document.querySelectorAll('.cnt-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    selectedCount = +btn.dataset.n;
  });

  document.getElementById('startBtn').onclick = startQuiz;
})();

// ===== QUIZ =====
function startQuiz() {
  let pool = selectedCats.size === 0
    ? [...QUIZ_DATA]
    : QUIZ_DATA.filter(q => selectedCats.has(q.category));

  // shuffle Fisher-Yates
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  questions = selectedCount > 0 ? pool.slice(0, selectedCount) : pool;
  if (questions.length === 0) { alert('問題がありません'); return; }

  current = 0; score = 0; catStats = {}; wrongAnswers = [];
  showScreen('quizScreen');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];

  // progress
  document.getElementById('progText').textContent = (current + 1) + ' / ' + questions.length;
  document.getElementById('catLabel').textContent = q.category;
  document.getElementById('progFill').style.width = (current / questions.length * 100) + '%';

  // question text
  const nl = q.question.indexOf('\n\n');
  if (nl !== -1) {
    document.getElementById('qInstruction').textContent = q.question.slice(0, nl);
    document.getElementById('qStatement').textContent = q.question.slice(nl + 2);
  } else {
    document.getElementById('qInstruction').textContent = '';
    document.getElementById('qStatement').textContent = q.question;
  }

  // choice buttons
  const isMaruBatsu = (q.choice1 === '\u25cb' && q.choice2 === '\u00d7') ||
                      (q.choice1 === '\u25cb' && q.choice2 === '\xd7');
  const btn1 = document.getElementById('btn1');
  const btn2 = document.getElementById('btn2');
  btn1.textContent = q.choice1;
  btn2.textContent = q.choice2;
  btn1.disabled = false; btn2.disabled = false;
  btn1.className = 'choice-btn' + (isMaruBatsu ? ' maru-x' : '');
  btn2.className = 'choice-btn' + (isMaruBatsu ? ' maru-x' : '');

  // hide feedback
  document.getElementById('feedbackBox').className = 'feedback-box';
  document.getElementById('nextBtn').className = '';
  document.getElementById('nextBtn').style.display = 'none';

  // Show English toggle button and reset
  const enBtn = document.getElementById('enToggleBtn');
  enBtn.style.display = '';
  enBtn.textContent = '🌐 英訳';
  const enDiv = document.getElementById('qEnglish');
  enDiv.className = 'q-english';
  enDiv.textContent = '';
}

function answer(val) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const correct = +q.answer === +val;
  if (correct) score++;
  else wrongAnswers.push({ q, userAnswer: val });

  if (!catStats[q.category]) catStats[q.category] = { ok: 0, total: 0 };
  catStats[q.category].total++;
  if (correct) catStats[q.category].ok++;

  const btn1 = document.getElementById('btn1');
  const btn2 = document.getElementById('btn2');
  btn1.disabled = true; btn2.disabled = true;

  // color correct/wrong
  btn1.classList.add(+q.answer === 1 ? 'correct' : 'wrong');
  btn2.classList.add(+q.answer === 2 ? 'correct' : 'wrong');

  // feedback
  document.getElementById('verdict').textContent = correct ? '正解！' : '不正解';
  document.getElementById('verdict').className = 'verdict ' + (correct ? 'ok' : 'ng');
  document.getElementById('correctAns').textContent = correct ? '' : ('正解: ' + (+q.answer === 1 ? q.choice1 : q.choice2));
  document.getElementById('explainText').textContent = q.explain || '';
  document.getElementById('feedbackBox').className = 'feedback-box visible';

  // next button
  const nb = document.getElementById('nextBtn');
  nb.textContent = current + 1 >= questions.length ? '結果を見る' : '次の問題 →';
  nb.style.display = 'block';
  nb.className = 'visible';
}

document.getElementById('btn1').onclick = () => answer(1);
document.getElementById('btn2').onclick = () => answer(2);
document.getElementById('nextBtn').onclick = nextQuestion;

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current >= questions.length) { showResult(); return; }
  renderQuestion();
}

// ===== RESULT =====
function showResult() {
  showScreen('resultScreen');
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('scoreSub').textContent = score + ' / ' + questions.length + ' 正解';
  const circle = document.getElementById('scoreCircle');
  circle.style.borderColor = pct >= 80 ? '#22c55e' : pct >= 60 ? '#eab308' : '#ef4444';

  const reviewBtn = document.getElementById('reviewBtn');
  if (wrongAnswers.length > 0) {
    reviewBtn.style.display = '';
    reviewBtn.textContent = '間違い復習 (' + wrongAnswers.length + '問)';
  } else {
    reviewBtn.style.display = 'none';
  }

  const breakdown = document.getElementById('catBreakdown');
  breakdown.innerHTML = '';
  Object.entries(catStats)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .forEach(([cat, s]) => {
      const p = Math.round(s.ok / s.total * 100);
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML =
        '<span class="cat-name">' + esc(cat) + '</span>' +
        '<span class="cat-score">' + s.ok + '/' + s.total + ' (' + p + '%)</span>' +
        '<div class="cat-mini-bar"><div class="cat-mini-fill" style="width:' + p + '%"></div></div>';
      breakdown.appendChild(row);
    });
}

document.getElementById('retryBtn').onclick = startQuiz;
document.getElementById('backBtn').onclick = () => showScreen('startScreen');
document.getElementById('reviewBtn').onclick = startReview;

  document.getElementById('reviewQNum').textContent = 'No.' + q.no + '　' + q.category;

  const nl = q.question.indexOf('\n\n');
  if (nl !== -1) {
    document.getElementById('reviewInstruction').textContent = q.question.slice(0, nl);
    document.getElementById('reviewStatement').textContent = q.question.slice(nl + 2);
  } else {
    document.getElementById('reviewInstruction').textContent = '';
    document.getElementById('reviewStatement').textContent = q.question;
  }

  // Reset translation display
  const enDiv = document.getElementById('reviewEn');
  enDiv.className = 'review-en';
  enDiv.textContent = '';
  const tBtn = document.getElementById('translateBtn');
  tBtn.textContent = '🌐 英訳を表示';

  // Choices
  const choicesDiv = document.getElementById('reviewChoices');
  choicesDiv.innerHTML = '';
  [1, 2].forEach(v => {
    const btn = document.createElement('div');
    const isCorrect = v === correctAnswer;
    const isUserPick = v === userAnswer;
    btn.className = 'review-choice ' + (isCorrect ? 'correct' : (isUserPick ? 'wrong-sel' : 'neutral'));
    btn.textContent = (v === 1 ? q.choice1 : q.choice2);
    choicesDiv.appendChild(btn);
  });

  document.getElementById('reviewAnswer').textContent = '✓ 正解: ' + (correctAnswer === 1 ? q.choice1 : q.choice2);
  document.getElementById('reviewExplain').textContent = q.explain || '';

  // Update nav buttons
  document.getElementById('reviewPrevBtn').disabled = reviewCurrent === 0;
  document.getElementById('reviewPrevBtn').style.opacity = reviewCurrent === 0 ? '0.4' : '';
  const isLast = reviewCurrent === wrongAnswers.length - 1;
  document.getElementById('reviewNextBtn').style.display = isLast ? 'none' : '';
  document.getElementById('reviewDoneBtn').style.display = isLast ? '' : 'none';
}

function reviewNav(dir) {
  reviewCurrent = Math.max(0, Math.min(wrongAnswers.length - 1, reviewCurrent + dir));
  renderReview();
}

async function toggleEnglish() {
  const item = wrongAnswers[reviewCurrent];
  const q = item.q;
  const enDiv = document.getElementById('reviewEn');
  const tBtn = document.getElementById('translateBtn');
  if (enDiv.classList.contains('visible')) {
    enDiv.classList.remove('visible');
    tBtn.textContent = '🌐 英訳を表示';
  } else {
    tBtn.textContent = '🌐 読み込み中...';
    const text = await fetchTranslation(q);
    enDiv.textContent = text;
    enDiv.classList.add('visible');
    tBtn.textContent = '🌐 英訳を隠す';
  }
}

async function toggleQuizEnglish() {
  const q = questions[current];
  const enDiv = document.getElementById('qEnglish');
  const btn = document.getElementById('enToggleBtn');
  if (enDiv.classList.contains('visible')) {
    enDiv.classList.remove('visible');
    btn.textContent = '🌐 英訳';
  } else {
    btn.textContent = '読み込み中...';
    const text = await fetchTranslation(q);
    enDiv.textContent = text;
    enDiv.classList.add('visible');
    btn.textContent = '🌐 英訳を隠す';
  }
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (!document.getElementById('quizScreen').classList.contains('active')) return;
  if (!answered && e.key === '1') { answer(1); }
  else if (!answered && e.key === '2') { answer(2); }
  else if (answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQuestion(); }
});

// タッチデバイスではキーボードヒントを非表示
if ('ontouchstart' in window) document.getElementById('kbdHint').style.display = 'none';

// ===== UTIL =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
